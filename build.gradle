plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Files from the old "dcme" layout may still be in a repo that was upgraded in place; never package them.
sourceSets {
    main {
        java { exclude 'com/dcme/**' }
        resources {
            exclude 'assets/dcme/**'
            exclude 'dcme.mixins.json'
        }
    }
}

// The Mod Menu classes in src/ are compile-time stubs only. The real Mod Menu provides them at runtime,
// so they must not be packaged (duplicate classes would conflict).
jar {
    exclude 'com/terraformersmc/**'
}
